# A textbook all-pass microring on 200 nm silicon nitride.
#
# The concept of operation is in DESIGN_CONCEPT.md beside this file and was
# written before these targets. Every target below traces to a clause of it,
# and `design-chain/tools/check_concept_trace.py` checks that both ways.
#
# This is the first design in the repository to declare silicon nitride, the
# first to declare an etch depth equal to its film thickness, and the first to
# assemble a resonator. The first run is therefore a test of the chain, and the
# findings of it are recorded in REPORT.md rather than read as properties of the
# device.

meta:
  name: sin200_ring
  title: "All-pass microring, 200 nm Si3N4 strip in silica, C band"
  status: scaffold

platform:
  # Silicon nitride is isotropic, so `cut` selects nothing: Material.
  # eps_optical_device returns one index for all three axes before it reads the
  # field. It is left at the schema default rather than given a value that would
  # read as a crystal orientation.
  cut: x
  film_material: Si3N4
  film_thickness_um: 0.200
  # A full etch. The film is removed entirely beside the guide, so there is no
  # slab and the lateral guidance floor is the cladding.
  etch_depth_um: 0.200
  sidewall_deg: 90.0
  box_material: SiO2
  box_thickness_um: 3.0
  clad_material: SiO2
  clad_thickness_um: 2.0
  # ASSUMPTION: no measurement of a silicon nitride device is held in this
  # repository, and the material file's 0.01 dB/cm is a typical figure for the
  # material rather than for a patterned guide. 0.2 dB/cm is a working value for
  # a stoichiometric LPCVD film with a sidewall, and every quantity that depends
  # on it is reported across resonator.loss_sweep_dB_per_cm as well.
  propagation_loss_dB_per_cm: 0.2

waveguide:
  # 1.30 um holds the guide single mode at 1550 nm with margin: the chain
  # returns one guided mode to 1.50 um and two at 1.80 um.
  top_width_um: 1.30
  wavelength_um: 1.55

mesh:
  d_fine_um: 0.010
  d_coarse_um: 0.050
  num_modes: 4
  polarisation: TE

grating:
  enabled: false

electrodes:
  enabled: false

cavity:
  enabled: false

fem:
  enabled: true
  with_posts: false

bend:
  enabled: true
  # 100 um is the ring radius and must appear here for the resonator stage to
  # read a bend row at it. The tighter radii establish where the conformal
  # solve stops finding a bound mode on this weakly confining stack.
  radii_um: [400.0, 200.0, 100.0, 60.0, 40.0, 25.0]

resonator:
  enabled: true
  radius_um: 100.0
  # A fallback, and the run of record does not use it. The `fdtd` stage is in
  # this design's stage list and measures the coupling on every run, so
  # `resonator.kappa_squared_source` reads `fdtd point-coupler solve`. The value
  # here is that measurement transcribed, and it is what the resonator stage
  # falls back to on a host where meep cannot be reached, so that the rest of
  # the design still solves. A run that used it says so in that field.
  #
  # The gap was found by solving four: 0.5, 1.0, 1.5 and 2.0 um give 2.3338e-1,
  # 3.0184e-2, 3.6534e-3 and 3.8711e-4. The implied decay rises across the
  # ladder, being 2.045, 2.112 and 2.245 per micrometre over the three
  # intervals. The tightest gap is two orders too strong for a 100 um ring and
  # its solve accounts for only 93.8 per cent of its input, the two guides being
  # close enough at that separation to stop behaving as a point coupler. The
  # widest carries a residual a third the size of its own coupling. REPORT.md
  # states what that ladder does and does not establish.
  kappa_squared: 0.003653
  # The loop loss is not measured on this stack, so the device is reported
  # across the range a nitride process spans: a research-grade film, a typical
  # one, and a lossy one.
  loss_sweep_dB_per_cm: [0.05, 0.1, 0.2, 0.5, 1.0]

fdtd:
  enabled: true
  structure: coupler
  dimensions: 2
  coupler_gap_um: 1.50
  coupler_ring_radius_um: 100.0
  coupler_half_length_um: 20.0
  coupler_port_width_um: 4.0
  coupler_margin_um: 2.0
  resolution: 40
  convergence_resolution: 20

warnings:
  acknowledged:
    - key: fem.two_mode_solvers_disagree
      reason: >-
        The two solvers differ by 0.115 per cent on the absolute effective
        index, against the 0.100 per cent the chain deems material. The
        disagreement is accepted and its cause is stated: this cross-section
        holds 31.7 per cent of its mode in the film, against 57.8 per cent for
        the next least confined the chain has solved, and across the
        cross-sections solved by both solvers the disagreement tracks that
        confinement. No target reads the absolute index. The group index does,
        through the free spectral range, and it was bounded separately by
        central difference on both solvers to 0.016 per cent. REPORT.md carries
        the table and the runs.

    - key: bend.3_6_radii_could
      reason: >-
        The radii of 60, 40 and 25 um are posed to locate the radius at which
        the conformal transformation stops returning a bound mode on this
        weakly confining stack, and the answer is that it lies between 60 and
        100 um. The ring is drawn at 100 um, where the solve succeeds and
        places the radiation caustic 5.64 um from the guide, being 11.4 lateral
        decay lengths.

    - key: resonator.extinction_requirement_is_a_loss_tolerance
      reason: >-
        Accepted as the design statement it is. A required extinction admits a
        band of propagation losses about the one at which the drawn coupling is
        critical, and the width of that band follows from the required
        extinction alone. 10 dB is the depth the concept derives from a
        fibre-coupled measurement, and the band it leaves is the margin this
        design has against a process nobody has measured. REPORT.md gives the
        band, the arithmetic and what a stricter requirement would cost.

    - key: fdtd.coupler_residual_against_the_coupling
      reason: >-
        Accepted and carried as an open question rather than as a defect in the
        mask. The coupler solve leaves about a fifth of what it reports as
        crossing unaccounted for, and the fraction holds across four gaps while
        the absolute residual falls by a factor of 460, which is a systematic.
        The coupling is therefore established to about that fifth. The design
        point survives it: a coupling understated by a fifth moves the critical
        loss from 0.253 to 0.307 dB/cm, inside the band over which the
        10 dB row is met. This finding appears only where the fdtd stage runs.

    - key: fdtd.coupler_two_dimensional
      reason: >-
        Accepted, and the reduction's validity on a fully etched film is the
        open question REPORT.md states under "What is not settled". The runner
        warns that the reduction assumes a continuous slab across the gap, which
        this film does not have, so the background of the reduction is the
        cladding rather than a slab. Whether the reduced problem's evanescent
        decay matches the real cross-section is not established by the gap
        ladder, and the direction of any error is that the reduction decays
        faster and therefore understates the coupling. The design point
        tolerates a coupling understated by a fifth.

    - key: resonator.extinction_follows_an_assumed_loss
      reason: >-
        This is the central statement of the design rather than a defect. The
        propagation loss of the stack is not measured anywhere in this
        repository, so the extinction is a function of an assumption, and the
        design reports it across resonator.loss_sweep_dB_per_cm for that
        reason. The drawn coupling is critically coupled at one loss and at no
        other, and which side of it the device falls on is a property of the
        process.

targets:
  # Clause: a spectrum carries one family of resonances.
  - metric: mode.n_guided_modes
    max: 1.0
    severity: must
    source: "the concept: two guided modes give two combs, which one transmission spectrum superimposes"

  # Clause: the loop resonates at a spacing the intended source can address.
  - metric: resonator.fsr_nm
    min: 1.5
    max: 3.0
    unit: nm
    severity: must
    source: "the concept: at least four orders inside a 12 nm tuning window, and orders far enough apart to be told apart"

  # Clause: an order is deep enough to be located.
  - metric: resonator.extinction_dB
    min: 10.0
    unit: dB
    severity: must
    source: "the concept: below ten decibels the notch is lost in the ripple of a fibre-coupled measurement"

  # Clause: an order is wide enough to be resolved.
  - metric: resonator.fwhm_pm
    min: 1.0
    unit: pm
    severity: should
    source: "the concept: a floor set by the source rather than by the device"

  # Clause: light survives the round trip.
  - metric: resonator.q_intrinsic
    min: 1.0e5
    severity: info
    source: "the concept: a restatement of the assumed loss, carried at info because grading it would be circular"

  # Clause: the coupler transfers the fraction intended.
  - metric: resonator.kappa_squared
    min: 1.0e-4
    max: 5.0e-2
    severity: info
    source: "the concept: a measured quantity, reported rather than graded against the assumption it replaces"

  # Clause: the round trip may be treated as a straight guide.
  - metric: resonator.bend_caustic_in_decay_lengths
    min: 5.0
    severity: should
    source: "the concept: the caustic five lateral decay lengths out puts the field at it below e^-10 in power, and the quantity is a proxy for a bend loss no stage computes, so it carries `should` and not `must`"

stages: [mode, fem, bend, grating, fdtd, resonator, verify]
