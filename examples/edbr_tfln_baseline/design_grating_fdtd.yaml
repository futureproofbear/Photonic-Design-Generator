platform:
  cut: x
  film_material: LiNbO3
  film_thickness_um: 0.4
  etch_depth_um: 0.21
  sidewall_deg: 77.0
  box_material: SiO2
  box_thickness_um: 4.7
  clad_material: SiO2
  clad_thickness_um: 2.0
  substrate_material: Si
  propagation_loss_dB_per_cm: 0.2
waveguide:
  top_width_um: 0.9
  wavelength_um: 1.5459
mesh:
  d_fine_um: 0.01
  d_coarse_um: 0.06
  fine_margin_um: 0.6
  subsample: 3
  num_modes: 3
  polarisation: TE
grating:
  enabled: true
  order: 3
  period_um: 1.302
  length_um: 11000.0
  post_width_um: 0.3
  post_gap_um: 0.855
  post_length_um: 0.3
  profile_sigma_um: 0.0
  apodisation: uniform
  span_GHz: 200.0
  points: 6001
meta:
  name: edbr_tfln_grating_fdtd
  title: The E-DBR grating in the time domain, at the settings that resolved LTOI
  status: scaffold
electrodes:
  enabled: false
cavity:
  enabled: false
fem:
  enabled: false
bend:
  enabled: false
fdtd:
  enabled: true
  structure: grating
  dimensions: 2
  resolution: 30
  grating_periods: 450
  pml_um: 2.0
  cell_width_um: 10.0
  in_length_um: 6.0
  out_length_um: 6.0
  convergence_resolution: 20
warnings:
  acknowledged:
  - key: fdtd.time_domain_kappa_moves
    reason: 'Accepted as the finding of this design rather than a defect in it. The
      purpose of the run is the first execution of the finite-grating time-domain
      runner, which no design had ever selected. The coupling constant moves by 86
      per cent between resolution 10 and 20, so the route does not resolve this grating
      at a mesh this host can afford. The perturbation is an index step of 3.7e-4
      from posts 0.3 um wide, which is six cells at resolution 20. The design of record
      for this device takes the band-structure route for that reason, and this run
      measures the reason rather than asserting it.

      '
  - key: grating.uniform_unapodised_grating_expect
    reason: 'The grating is uniform by construction, being the one the E-DBR baseline
      draws. Sidelobes are expected and are graded in that design, not here. This
      design exists to exercise the runner and carries no acceptance target.

      '
stages:
- mode
- grating
- fdtd
- verify
