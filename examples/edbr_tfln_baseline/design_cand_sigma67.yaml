    severity: error
  - name: WG_min_area
    kind: min_area
    layer: WG
    value_um: 0.04
    severity: warning
search:
  enabled: false
  parameters:
  - path: grating.post_gap_um
    min: 0.5
    max: 1.0
    probe: 0.05
  - path: cavity.rsoa.length_um
    min: 250.0
    max: 1500.0
    probe: 0.1
  - path: cavity.feed_length_um
    min: 200.0
    max: 1500.0
    probe: 0.1
  - path: electrodes.gap_um
    min: 6.0
    max: 12.0
    probe: 0.05
  constraints:
  - cavity.feed_length_um >= layout.taper_length_um
  stages:
  - mode
  - grating
  - eo
  - cavity
  - dynamics
  - layout
  - drc
  severities:
  - must
  - should
  max_evaluations: 60
targets:
- metric: mode.n_guided_modes
  max: 1
  severity: must
  source: 'paper: thin film + shallow etch chosen to ensure single-mode operation'
- metric: grating.bragg_wavelength_nm
  value: 1545.9
  rel_tol: 0.02
  unit: nm
  severity: must
  source: 'paper Sec.II: measured 1545.9 nm, 1.2% from design'
- metric: grating.peak_reflectivity
  value: 0.75
  rel_tol: 0.2
  severity: must
  source: 'paper Fig.1d: estimated peak reflectivity around 75%'
- metric: grating.fwhm_GHz
  min: 5.0
  max: 14.0
  unit: GHz
  severity: should
  source: 'paper: 6.5 GHz simulated, 8 GHz measured off-chip'
- metric: eo.tuning_MHz_per_V
  value: 550.0
  rel_tol: 0.3
  unit: MHz/V
  severity: must
  source: 'paper Fig.2a: 550 MHz/V; 10 GHz over 20 V'
- metric: eo.VpiL_ideal_V_cm
  value: 4.0
  rel_tol: 0.25
  unit: V.cm
  severity: should
  source: 'paper Sec.II: simulated VpiL of 4 V.cm (quoted without overlap derating)'
- metric: eo.mode_overlap_with_metal
  max: 1.0e-05
  severity: must
  source: 'paper: electrodes placed conservatively to avoid optical loss'
- metric: cavity.mode_hop_free_range_GHz
  min: 8.0
  unit: GHz
  severity: should
  source: 'paper abstract: continuous mode-hop-free tuning range over 10 GHz'
- metric: cavity.schawlow_townes_henry_linewidth_kHz
  value: 2.8
  rel_tol: 1.0
  unit: kHz
  severity: should
  source: 'paper Sec.III: 800 Hz^2/Hz at 2 MHz offset -> 2.8 kHz intrinsic linewidth'
- metric: cavity.smsr_dB
  min: 40.0
  unit: dB
  severity: should
  source: 'paper Fig.3e: SMSR 63 dB at 0.02 nm RBW'
- metric: drc.error_violations
  max: 0
  severity: must
  source: mask must be DRC clean
- metric: layout.mask_is_complete
  min: 1
  severity: info
  source: a submitted mask carries the whole device; the default draws a window of
    it
allow_unconfirmed_materials: true
release:
  enabled: true
  revision: A
  strict: true
  waive: []
circuit:
  enabled: true
  facet_transmission: 0.7
  taper_transmission: 0.99
stages:
- mode
- grating
- eo
- cavity
- dynamics
- verify
