meta:
  name: ltoi300_testchip_facet
  title: The 8 degree facet of the test chip, against a lensed fibre
  status: scaffold
platform:
  cut: x
  materials_file: design-chain/pdk/LXT_LT_PRO/materials_lt_pro.yaml
  film_material: LiTaO3
  film_thickness_um: 0.3
  etch_depth_um: 0.18
  slab_offset_um: 6.0
  sidewall_deg: 70.0
  box_thickness_um: 7.0
  clad_thickness_um: 2.0
  substrate_material: Si
waveguide:
  top_width_um: 2.5
  wavelength_um: 1.55
mesh:
  d_fine_um: 0.01
  d_coarse_um: 0.06
  num_modes: 4
  polarisation: TE
grating:
  enabled: false
electrodes:
  enabled: false
cavity:
  enabled: false
fem:
  enabled: false
bend:
  enabled: false
fdtd:
  enabled: false
facet:
  enabled: true
  partner_mfd_x_um: 2.5
  partner_mfd_y_um: 2.5
  partner_index: 1.468
  ar_reflectivity: 0.0001
  partner_tilted: true
  facet_angle_deg: 8.0
  gap_um: 0.0
  gap_index: 1.0
  # Declared rather than inherited. The stage falls back to
  # layout.taper_tip_width_um, and this design carries no layout block, so the
  # fallback would have taken a schema default that happens to equal the test
  # chip's 0.4 um. A device dimension is not to be correct by coincidence.
  facet_width_um: 0.4
warnings:
  acknowledged:
    - key: mode.cross_section_supports_3
      reason: >
        The test chip's guide is 2.5 um wide and multimode by construction, the
        electrode gap ladder requiring the width. The facet couples the
        fundamental, which is what this stage grades.
    - key: facet.facet_computed_lose_1
      reason: >
        Accepted as the finding of this run. The design declares no cavity, so
        no coupling loss is stated anywhere in it and the computed 1.93 dB is
        graded against nothing. The figure belongs in an acceptance target on
        the test chip's own design when the coupling budget is set, and this
        design exists to exercise the stage rather than to set that budget.

stages:
- mode
- facet
- verify
