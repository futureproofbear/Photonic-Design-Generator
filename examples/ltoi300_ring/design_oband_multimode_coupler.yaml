# The cross-section of the ltoi300 single-mode O-band ring, posed to the chain.
#
# The geometry is that of `ring_resonator_single_mode_point_coupler_oband` in
# the Luxtelligence PDK: a 0.7 um ridge, 180 nm etched into a 300 nm lithium
# tantalate film, on a 120 nm slab, at 1310 nm. The purpose of the run is to
# replace the group index of 2.2 that the PDK carries with a TODO beside it,
# to bound the mode solver against an independent one, and to establish what
# the 200 um bend does to the mode.

meta:
  name: ltoi300_ring_oband_multimode_coupler
  title: "The multimode ring point coupler, a 1.5 um ring against a 0.7 um bus"
  status: scaffold

platform:
  cut: x
  materials_file: ../../design-chain/pdk/LXT_LT_PRO/materials_lt_pro.yaml
  film_material: LiTaO3
  film_thickness_um: 0.300
  etch_depth_um: 0.180
  sidewall_deg: 70.0            # the PDK layer stack declares 20 deg from vertical
  box_thickness_um: 7.0
  clad_thickness_um: 2.0

waveguide:
  top_width_um: 0.700
  wavelength_um: 1.31

mesh:
  d_fine_um: 0.008
  d_coarse_um: 0.050
  num_modes: 3
  polarisation: TE

grating:
  enabled: false

electrodes:
  enabled: false

cavity:
  enabled: false

fem:
  enabled: false

bend:
  enabled: false

# The point coupler of the PDK cell, solved in the plane. The gap and the radius
# are those of `ring_resonator_single_mode_point_coupler_oband`.
fdtd:
  enabled: true
  structure: coupler
  dimensions: 2
  resolution: 50
  convergence_resolution: 25
  pml_um: 1.0
  coupler_gap_um: 0.75          # cells.py, the multimode cell
  coupler_ring_width_um: 1.5    # the ring is wider than the bus
  coupler_cross_bands: 3        # the ring carries three modes
  coupler_ring_radius_um: 200.0
  coupler_half_length_um: 20.0
  coupler_port_width_um: 3.0
  coupler_margin_um: 1.5
  coupler_bandwidth_frac: 0.04
  coupler_frequencies: 11
  processes: 12
  wsl_distro: Ubuntu-22.04
  environment: mpp

warnings:
  acknowledged:
    - key: fdtd.coupler_two_dimensional
      reason: >-
        The PDK cross-section draws the 120 nm slab 6 um either side of every
        ridge, so the slab is continuous across the 1.05 um gap and the lateral
        reduction is the appropriate instrument. The vertical channel is
        declared as a limitation, a three-dimensional solve of the same window
        being the check on it.

targets:
  - metric: mode.n_guided_modes
    max: 1.0
    severity: must
    source: "the cell is named single-mode and the ring width is 0.7 um"

  - metric: fdtd.unitarity
    value: 1.0
    rel_tol: 0.01
    severity: must
    source: "a point coupler carries no radiation channel, so the two ports account for the input"

  - metric: mode.n_eff_bare
    value: 1.75
    rel_tol: 0.05
    severity: should
    source: "the PDK compact model states n_eff 1.75 at 1.31 um"

  - metric: mode.n_g
    value: 2.2
    rel_tol: 0.05
    severity: should
    source: "the PDK compact model states n_g 2.2, marked TODO in the source"

stages: [mode, fdtd, verify]
