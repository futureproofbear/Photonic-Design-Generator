warnings:
  acknowledged:
  - key: mode.cross_section_supports_3
    reason: A 2.0 um ridge etched 440 nm into a 600 nm film carries several guided
      modes and the device drives its fundamental TE mode. The finding names a requirement
      of the extended-DBR laser this chain was first written for and states nothing
      about a modulator arm, whose width is chosen for the electro-optic overlap and
      for the propagation loss.
  - key: mode.index_override_declared_and_unread
    reason: The generic library carries thin-film indices measured at 1550 nm by Wang
      et al. and held for reference. The Sellmeier fit is evaluated here instead,
      so that the dispersion and with it the group index are continuous across the
      band. The group index enters the velocity mismatch and the half-wave voltage
      depends on the extraordinary index, and the two routes differ by 0.004 at this
      wavelength.
  - key: eo.electrostatic_solve_converged_halving
    reason: Accepted on the same terms as the ltoi300 runs beside it and for the same
      reason, being the sloped ridge sidewall across which the permittivity steps
      by a factor of eleven. The ladder and the extrapolation are in the study README.
      This run is posed at the same cell as those runs so that the mesh error is common
      to both and the ratio between them is the quantity read.
  - key: eo.lumped_rc_estimate_gives
    reason: Over 18 mm the electrode is a transmission line and the lumped estimate
      is not the bandwidth, which is what the finding says. The travelling-wave figure
      is the one read here and the lumped one is reported beside it so that the two
      can be seen to differ.
  - key: modulator.3_db_bandwidth_21
    reason: The finding is the result this run exists to produce, and it is reported
      rather than accepted as ordinary. The paper measures 64 GHz over 18 mm on a
      T-shaped segmented slow-wave electrode, and this run poses the unloaded coplanar
      line of the same gap, which reaches 21.7 GHz over that length. The difference
      is the electrode design and the conductor metallurgy, neither of which a two-dimensional
      cross-section of the unloaded line carries. The study README states what would
      be required to close it.
targets:
- metric: modulator.VpiL_device_V_cm
  value: 2.754
  rel_tol: 0.15
  severity: should
  source: the paper measures a half-wave voltage of 1.53 V at 1550 nm over 18 mm arms,
    which is 2.754 V cm read on the push-pull convention
stages:
- mode
- eo
- modulator
- verify
