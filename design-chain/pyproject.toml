[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "picchain"
version = "0.1.0"
description = "Agent-drivable design chain for photonic integrated circuits"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pyyaml>=6",
  "pydantic>=2",
  "typer>=0.12",
  "rich>=13",
  "klayout>=0.29",
]

[project.optional-dependencies]
layout = ["gdsfactory>=8"]
fem    = ["femwell", "scikit-fem", "gmsh", "meshio", "shapely"]
circuit = ["sax", "jax"]
dev    = ["pytest>=8"]

[project.scripts]
picchain = "picchain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
