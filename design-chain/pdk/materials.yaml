# Material database for the photonic-radar design chain.
#
# Every entry carries a `provenance` field. Anything tagged `needs_confirmation`
# must be replaced with foundry- or measurement-derived data before a tape-out
# decision is taken. The verification stage refuses to sign off a design whose
# critical materials are still `needs_confirmation` unless
# `allow_unconfirmed_materials: true` is set in the design file.
#
# Units:
#   wavelength   um
#   r_ij         pm/V
#   eps_rf       relative permittivity (dimensionless), clamped (S) values
#   loss         dB/cm

materials:

  SiO2:
    kind: isotropic
    sellmeier:                        # Malitson 1965, fused silica
      form: sellmeier_1
      B: [0.6961663, 0.4079426, 0.8974794]
      C: [0.0684043, 0.1162414, 9.896161]   # sqrt(C) in um
    eps_rf: 3.9
    provenance: "Malitson, J. Opt. Soc. Am. 55, 1205 (1965); eps_rf from thermal SiO2 literature"

  Si:
    kind: isotropic
    index_const: 3.4757
    eps_rf: 11.7
    provenance: "Li 1980 (n at 1550 nm); handle wafer only, not optically active here"

  Air:
    kind: isotropic
    index_const: 1.0
    eps_rf: 1.0
    provenance: "definition"

  Au:
    kind: metal
    conductivity_S_per_m: 4.1e7
    provenance: "bulk gold; thin-film value is lower, see notes in eo stage"

  LiNbO3:
    kind: uniaxial
    # Crystal frame: o = ordinary (perp. to c), e = extraordinary (along c).
    sellmeier:
      form: sellmeier_zelmon_ln
      o: {A: 2.6734, B: 0.01764, C: 1.2290, D: 0.05914, E: 12.614, F: 474.60}
      e: {A: 2.9804, B: 0.02047, C: 0.5981, D: 0.06660, E: 8.9543, F: 416.08}
    eo_tensor:                        # pm/V, unclamped (r^T) at low frequency
      r13: 9.6
      r22: 6.8
      r33: 30.8
      r51: 32.6
    eps_rf:                           # clamped (r^S), crystal frame
      perp_c: 44.3                    # eps_11 = eps_22
      along_c: 27.9                   # eps_33
    loss_dB_per_cm: 0.2
    provenance: "Zelmon et al., JOSA B 14, 3319 (1997); EO+eps from Weis & Gaylord, Appl. Phys. A 37, 191 (1985). CONFIRMED for congruent LN."

  LiTaO3:
    kind: uniaxial
    # NOTE: bulk LiTaO3 constants are used as a starting point for thin-film
    # lithium tantalate (TFLT). Thin-film values, and in particular the
    # effective r33 after poling and the film thickness uniformity, MUST come
    # from the foundry. Project-specific foundry data belongs in a project
    # materials file referenced through `platform.materials_file`, never here.
    sellmeier:
      form: sellmeier_zelmon_lt       # Zelmon-style 3-term fit to congruent LT
      o: {A: 3.29628, B: 0.03246, C: 0.06724, D: 0.13594, E: 1.85677, F: 244.0}
      e: {A: 3.28553, B: 0.03164, C: 0.07642, D: 0.13540, E: 1.85710, F: 244.0}
    index_override_1550:              # used when `use_index_override: true`
      o: 2.1188
      e: 2.1145
    eo_tensor:
      r13: 8.4
      r22: 0.2
      r33: 30.5
      r51: 20.0
    eps_rf:
      perp_c: 40.9                    # eps_11
      along_c: 42.5                   # eps_33
    loss_dB_per_cm: 0.2
    provenance: "needs_confirmation - bulk congruent LiTaO3 (Bruner et al. Opt. Lett. 28, 194 (2003); Yamada 1990). Thin-film r33, eps_rf and loss to be replaced with foundry PCM data."

  Si3N4:
    kind: isotropic
    index_const: 1.996
    eps_rf: 7.5
    loss_dB_per_cm: 0.01
    provenance: "typical LPCVD stoichiometric SiN at 1550 nm; ultra-low-loss process dependent"

  InP:
    kind: isotropic
    index_const: 3.17
    group_index: 3.6
    provenance: "needs_confirmation - RSOA vendor datasheet required (group index drives cavity FSR)"

  CeYIG:
    kind: magneto_optic
    index_const: 2.2
    faraday_rotation_deg_per_cm: 4500
    loss_dB_per_cm: 60
    provenance: "needs_confirmation - Ce:YIG for on-chip isolator (D5); bonded-film values vary widely"
